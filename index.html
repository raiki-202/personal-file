<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23111112%27/%3E%3Cpath d=%27M30 70V30h40v10H40v10h25v10H40v20z%27 fill=%27%23e8e8ea%27/%3E%3C/svg%3E" />
  <title>Personal File - Money & Life Manager</title>
  <meta name="theme-color" content="#0f0f10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="container">
      <div class="row">
        <div class="brand">Personal File</div>
        <div class="badge" id="envBadge">bundle優先 / Firestore差分</div>
        <div class="spacer"></div>

        <select id="monthPicker" class="input" style="max-width:160px; display:none;"></select>
        <button class="btn secondary" id="btnReload" style="display:none;">再読込</button>
        <button class="btn secondary" id="btnLogout" style="display:none;">ログアウト</button>
      </div>

      <div class="sep" style="margin:10px 0;"></div>

      <div class="tabs" id="tabs" style="display:none;">
        <button class="tab active" data-route="home">ホーム</button>
        <button class="tab" data-route="money">お金</button>
        <button class="tab" data-route="accounts">口座</button>
        <button class="tab" data-route="fixed">固定費</button>
        <button class="tab" data-route="family">家族</button>
        <button class="tab" data-route="events">定期イベント</button>
        <button class="tab" data-route="settings">設定</button>
      </div>
    </div>
  </div>

  <main class="container" style="padding-top:16px;">
    <div id="loginView" class="card" style="max-width:560px; margin:20px auto;">
      <h1 class="h1">ログイン</h1>
      <div class="small" style="margin-top:6px;">
        Firestore rules は <b>users/UID</b> の role/active を参照します。<br/>
        まず Firebase コンソールでユーザー作成 → Firestore に users/{uid} を作ってください。
      </div>
      <div class="sep"></div>
      <div class="formGrid">
        <div>
          <div class="small">Email</div>
          <input id="email" class="input" placeholder="example@gmail.com" />
        </div>
        <div>
          <div class="small">Password</div>
          <input id="password" class="input" type="password" placeholder="••••••••" />
        </div>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn" id="btnLogin">ログイン</button>
        <button class="btn secondary" id="btnAnonHint" title="匿名ログインは無効（推奨しません）">※匿名ログイン非対応</button>
        <div class="spacer"></div>
      </div>
      <div id="loginMsg" class="small" style="margin-top:10px;"></div>

      <div class="sep"></div>
      <div class="small">
        🔧 <b>Firebase設定</b>：<code>app.js</code> の <code>FIREBASE_CONFIG</code> をあなたのプロジェクトに差し替えてください。
      </div>
    </div>

    <div id="appView" style="display:none;"></div>
  </main>

  <!-- Modal -->
  <div class="modalOverlay" id="modalOverlay" aria-hidden="true">
    <div class="modal">
      <div class="modalHeader">
        <div class="modalTitle" id="modalTitle">Modal</div>
        <div class="spacer"></div>
        <button class="btn secondary" id="modalClose">閉じる</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
